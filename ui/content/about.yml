title: About US
description: a simple tool that lets me send sms messages to multiple people at once.
content: |
  a simple tool that lets me send sms messages to multiple people at once. built because i needed a way to send quick updates to friends and family without group chat chaos.

  add phone numbers with country codes, type a message, and it shows you how many sms segments it'll use (160 chars = 1 sms). handy for keeping track of costs. what it does
  — multiple phone numbers, select country codes
  — character counter, shows sms segments
  — simple form, does one thing

